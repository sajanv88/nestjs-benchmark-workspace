name: nest-adapter-benchmarks

# Every bench service gets the same image and the same limits; only the adapter and port differ.
# Ports are published on the host's loopback for debugging. The runner uses the compose network.
x-bench-app: &bench-app
  image: bench-app:local
  build:
    context: .
    dockerfile: apps/bench-app/Dockerfile
  cpus: 1.0
  mem_limit: 512m
  memswap_limit: 512m
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped

# Fast while starting, then rare: a probe inside a 1-CPU container would land in measured runs.
x-bench-healthcheck: &bench-healthcheck
  interval: 5m
  timeout: 3s
  retries: 3
  start_period: 30s
  start_interval: 1s

services:
  bench-express:
    <<: *bench-app
    environment:
      BENCH_ADAPTER: express
      PORT: "3001"
    ports:
      - "127.0.0.1:3001:3001"
    healthcheck:
      <<: *bench-healthcheck
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3001/health"]

  bench-fastify:
    <<: *bench-app
    environment:
      BENCH_ADAPTER: fastify
      PORT: "3002"
    ports:
      - "127.0.0.1:3002:3002"
    healthcheck:
      <<: *bench-healthcheck
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3002/health"]

  bench-node:
    <<: *bench-app
    environment:
      BENCH_ADAPTER: node
      PORT: "3003"
    ports:
      - "127.0.0.1:3003:3003"
    healthcheck:
      <<: *bench-healthcheck
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:3003/health"]

  # Waits for POST /run; starting it starts no load. Published on the host's loopback only:
  # it executes load tests on request and must never be exposed publicly.
  # One-shot CLI: docker compose run --rm -T runner node dist/cli.js
  runner:
    image: runner:local
    build:
      context: .
      dockerfile: apps/runner/Dockerfile
    # More than the apps get, so the load generator is never the bottleneck being measured.
    cpus: 2.0
    mem_limit: 1g
    memswap_limit: 1g
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: "4000"
      RESULTS_PATH: /data/latest.json
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./results:/data
    healthcheck:
      <<: *bench-healthcheck
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:4000/health"]
    depends_on:
      bench-express:
        condition: service_healthy
      bench-fastify:
        condition: service_healthy
      bench-node:
        condition: service_healthy
